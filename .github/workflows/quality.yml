name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test tools
        run: >-
          python -m pip install
          requests==2.34.2
          fastapi==0.141.1
          python-multipart==0.0.32
          httpx2==2.7.0
          coverage[toml]==7.15.2
          ruff==0.15.22
      - name: Static checks
        run: |
          python scripts/scan_secrets.py
          ruff check .
      - name: Deterministic retrieval quality gate
        run: >-
          python scripts/benchmark_sparse.py
          evals/retrieval_cases.jsonl
          evals/corpus/rag.md
          evals/corpus/retrieval.md
          evals/corpus/safety.md
          evals/corpus/storage.md
          --top-k 5
          --quality-gate evals/gates/bm25-smoke.json
          --json-output reports/bm25-smoke.json
          --markdown-output reports/bm25-smoke.md
      - name: Unit tests with branch coverage
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit pinned direct runtime requirements
        run: |
          python -m pip install pip-audit==2.10.1
          python scripts/audit_dependencies.py
