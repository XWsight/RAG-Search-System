name: rag-studio

services:
  api:
    image: rag-studio:${RAG_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12.11"
        APP_UID: "10001"
        APP_GID: "10001"
    env_file:
      - path: .env
        required: true
    environment:
      RAG_PERSIST_DATA: "true"
      RAG_STORAGE_ROOT: "/data"
      HOME: "/data"
      XDG_CACHE_HOME: "/data/cache"
      HF_HOME: "/data/cache/huggingface"
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports:
      - "${RAG_BIND_ADDRESS:-127.0.0.1}:${RAG_PUBLISHED_PORT:-8000}:8000"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456
    init: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: "${RAG_CONTAINER_CPUS:-2.0}"
    mem_limit: "${RAG_CONTAINER_MEMORY:-4g}"
    shm_size: "256m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  data:
    name: ${RAG_DATA_VOLUME:-rag-studio-data}
