[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-studio"
version = "2.0.0.dev0"
description = "Privacy-aware hybrid retrieval and grounded question answering"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb==1.5.9",
  "fastapi>=0.141,<0.142",
  "gradio>=6.22,<7",
  "langchain-chroma>=1.1,<2",
  "langchain-huggingface>=1.2,<2",
  "pypdf>=6.15,<7",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.32,<0.0.33",
  "requests>=2.34,<3",
  "sentence-transformers>=5.7,<6",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.15,<8",
  "httpx2>=2.7,<3",
  "mypy>=2.3,<2.4",
  "pip-audit>=2.10,<3",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["rag_system*"]

[tool.setuptools.package-data]
rag_system = ["web_ui/*.html", "web_ui/assets/*.css", "web_ui/assets/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".venv-test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
show_error_codes = true
files = [
  "rag_system/application.py",
  "rag_system/application_ports.py",
  "rag_system/answer_analysis.py",
  "rag_system/answer_benchmark.py",
  "rag_system/answer_suite.py",
  "rag_system/assets.py",
  "rag_system/benchmark_suite.py",
  "rag_system/bootstrap.py",
  "rag_system/catalog.py",
  "rag_system/config.py",
  "rag_system/coordination.py",
  "rag_system/domain.py",
  "rag_system/evaluation_suite.py",
  "rag_system/file_store.py",
  "rag_system/health.py",
  "rag_system/idempotency.py",
  "rag_system/index_manager.py",
  "rag_system/indexing.py",
  "rag_system/ingestion.py",
  "rag_system/jobs.py",
  "rag_system/job_contracts.py",
  "rag_system/job_store.py",
  "rag_system/loaders.py",
  "rag_system/memory.py",
  "rag_system/metrics.py",
  "rag_system/platform.py",
  "rag_system/ports.py",
  "rag_system/research.py",
  "rag_system/retrieval.py",
  "rag_system/retrieval_analysis.py",
  "rag_system/security.py",
  "rag_system/service.py",
  "rag_system/submission.py",
  "rag_system/tenancy.py",
]

[[tool.mypy.overrides]]
module = [
  "chromadb",
  "chromadb.*",
  "dotenv",
  "langchain_chroma",
  "langchain_huggingface",
  "pypdf",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["rag_system"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
