[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-studio"
version = "2.0.0.dev0"
description = "Privacy-aware hybrid retrieval and grounded question answering"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb==1.5.9",
  "fastapi>=0.141,<0.142",
  "gradio>=6.22,<7",
  "langchain-chroma>=1.1,<2",
  "langchain-huggingface>=1.2,<2",
  "pypdf>=6.15,<7",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.32,<0.0.33",
  "requests>=2.34,<3",
  "sentence-transformers>=5.7,<6",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.15,<8",
  "httpx2>=2.7,<3",
  "pip-audit>=2.10,<3",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["rag_system*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".venv-test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["rag_system"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
